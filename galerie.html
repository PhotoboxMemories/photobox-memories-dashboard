<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fotogalerie</title>
<script>window.I18N_V = '20261020-5';</script>
<script src="i18n.js?v=20261017-2"></script>
<script>// Sprache: vom QR-Code der Fotobox (?l=…), sonst die des Handys
(function () { var q = new URLSearchParams(location.search).get('l'), l = I18N.CODES.indexOf(q) >= 0 ? q : I18N.guess('en');
  window.PM_LANG = l; document.documentElement.lang = l; if (l !== 'de') document.write('<script src="lang/' + l + '.js?v=' + I18N_V + '"><\/script>'); })();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--y:#F9CB38;--k:#1D1D1B;--bg:#111110;--card:#1c1c1f;--line:#2e2e33;--muted:#a3a3ad}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#fff;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:26px 16px 18px;text-align:center;border-bottom:3px solid var(--y);background:var(--k)}
  header h1{margin:8px 0 4px;font-size:clamp(24px,5vw,40px);line-height:1.15;overflow-wrap:anywhere}
  header p{margin:0;color:var(--muted)}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .bar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:14px}
  .btn{background:var(--y);color:var(--k);border:0;border-radius:999px;padding:11px 20px;font:700 15px system-ui,sans-serif;cursor:pointer}
  .btn.ghost{background:#2a2a2e;color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  @media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}}
  .grid figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);cursor:zoom-in}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  .grid .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);font-size:11px;border-radius:6px;padding:2px 6px}
  .box{max-width:440px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
  .box h2{margin:0 0 8px}
  .box p{color:var(--muted);margin:0 0 16px}
  .box input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0f0f12;color:#fff;font:inherit;margin-bottom:12px;text-align:center}
  .err{color:#ff8f8f;min-height:1.4em;font-size:14px}
  #light{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
  #light.on{display:flex}
  #light img,#light video{max-width:96vw;max-height:76vh;border-radius:8px;background:#000}
  #light .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #light .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;padding:0;font-size:26px;background:rgba(255,255,255,.9);color:var(--k);border:0;cursor:pointer}
  #light .nav.l{left:10px}#light .nav.r{right:10px}
  footer{text-align:center;color:#6f6f78;font-size:12px;padding:26px 16px 34px}
  footer .privLink{display:block;margin-bottom:8px;color:inherit;text-decoration:underline}
  .langSel{display:block;margin:12px auto 0;background:transparent;color:#8a8a92;border:1px solid #3a3a40;border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
  .langSel option{color:#111}
  .one{text-align:center}.one img,.one video{max-width:100%;max-height:70vh;border-radius:10px;background:#000}
  .one p{color:var(--muted);font-size:14px}
  /* Slideshow (z. B. für einen zweiten Bildschirm oder Fernseher) */
  body.show header,body.show footer{display:none}
  #ss{position:fixed;inset:0;background:#000;cursor:pointer}
  #ss img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.2s}
  #ss img.on{opacity:1}
  #ss .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#777;font-size:13px}
  /* Einzelfoto (QR-Code an der Fotobox) – im Stil von Photobox Memories */
  body.solo{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,rgba(249,203,56,.28),rgba(249,203,56,0) 60%),#121211}
  body.solo header{background:none;border:0;padding:28px 16px 6px}
  body.solo header h1{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:clamp(26px,7vw,38px);margin:18px 0 2px}
  body.solo header p{font-size:15px}
  body.solo main{max-width:560px;padding:14px 18px 8px}
  .polaroid{background:#fff;border-radius:18px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
  .polaroid img,.polaroid video{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain;border-radius:10px;background:#f2f2f2}
  .polaroid .cap{margin-top:12px;text-align:center;font:600 16px Fredoka,system-ui,sans-serif;color:#1D1D1B;overflow-wrap:anywhere}
  .polaroid .cap:empty{display:none}
  .polaroid .cap img{display:inline-block;width:auto;height:44px;max-width:200px;max-height:none;object-fit:contain;vertical-align:middle;border-radius:0;background:none}
  #brandTop:not(:empty){margin-bottom:6px}
  #brandTop img{display:inline-block;height:64px;max-width:220px;object-fit:contain;border-radius:12px;background:#fff;padding:6px}
  #brandTop b{font:600 20px Fredoka,system-ui,sans-serif;color:var(--y);overflow-wrap:anywhere}
  .ph{aspect-ratio:2/3;max-height:60vh;margin:0 auto;border-radius:10px;background:linear-gradient(100deg,#eee 30%,#f8f8f8 50%,#eee 70%) 0 0/300% 100%;animation:shim 1.4s linear infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#555;padding:20px;text-align:center}
  .ph b{font:600 18px Fredoka,system-ui,sans-serif;color:#1D1D1B}
  .ph small{font-size:13px;color:#777;max-width:280px}
  .acts{display:flex;gap:10px;margin:20px 0 8px}
  .acts .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 18px;font-size:16px;box-shadow:0 6px 18px rgba(249,203,56,.25)}
  .acts .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:none}
  .tip{color:var(--muted);font-size:13px;text-align:center;margin:6px 0 0}
  body.solo footer{padding:22px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#8a8a92}
  .spin{width:40px;height:40px;border:4px solid rgba(0,0,0,.1);border-top-color:#F9CB38;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}} @keyframes shim{to{background-position:-300% 0}} @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
  @media(prefers-reduced-motion:reduce){.polaroid,.ph,.spin{animation:none}}
  /* Foto-Shop unter dem Einzelfoto (Druck über Gelato, Bezahlung über Stripe) */
  .shop{margin:30px 0 6px;padding:20px 14px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px}
  .shop h2{margin:0;font:600 22px Fredoka,system-ui,sans-serif;text-align:center}
  .shop .lead{margin:4px 0 16px;text-align:center;color:var(--muted);font-size:14px}
  .sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .sp{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;color:#1D1D1B;border:0;border-radius:14px;padding:8px 8px 11px;font:inherit;cursor:pointer;transition:transform .15s}
  .sp:hover{transform:translateY(-2px)}
  .sp b{font-size:14px;line-height:1.25;margin-top:7px;padding:0 2px}
  .sp span{font-size:14px;color:#9a7400;font-weight:700;padding:0 2px}
  .slegal{color:#8a8a92;font-size:12px;text-align:center;margin:12px 0 0;line-height:1.7}
  .slegal a{color:#c9c9cf}
  .stest{background:var(--y);color:var(--k);font-weight:700;font-size:13px;text-align:center;border-radius:10px;padding:6px 10px;margin-bottom:12px}
  .sdlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}
  .sdlg.on{display:flex}
  .sbox{position:relative;width:100%;max-width:460px;max-height:94vh;overflow:auto;background:#fff;color:#1D1D1B;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  @media(min-width:600px){.sdlg{align-items:center}.sbox{border-radius:20px}}
  .sbox .mk{max-width:280px;margin:0 auto}
  .ped{position:relative;width:100%;overflow:hidden;background:#fff;border:1px solid #e3e0d8;border-radius:10px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;margin-top:30px}
  .ped:active{cursor:grabbing}
  .ped img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
  .ped.mug::before,.ped.mug::after{content:'';position:absolute;top:0;bottom:0;width:6%;z-index:1;background:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 5px,rgba(255,255,255,.25) 5px 10px);pointer-events:none}
  .ped.mug::before{left:0}.ped.mug::after{right:0}
  .pedbar{display:flex;align-items:center;gap:8px;margin-top:10px;color:#6b6b78}
  .pedbar input{flex:1;accent-color:#E2A800}
  .pedbar button{border:1px solid #ddd;background:#f6f6f6;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:#1D1D1B}
  .sbox h3{margin:12px 0 6px;font:600 20px Fredoka,system-ui,sans-serif;text-align:center}
  .sx{position:absolute;right:10px;top:10px;z-index:1;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.08);font-size:22px;line-height:1;cursor:pointer;color:#1D1D1B}
  .sdrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #eee;font-size:15px}
  .sdrow.tot{font-size:17px;border-bottom:0}
  .qty{display:flex;align-items:center;gap:14px}
  .qty button{width:36px;height:36px;border-radius:50%;border:1px solid #ddd;background:#f6f6f6;font-size:19px;line-height:1;cursor:pointer;color:#1D1D1B}
  .fine{font-size:12px;color:#6b6b78;margin:6px 0 0;text-align:center}
  .sbox .btn{width:100%;margin-top:12px;padding:15px;font-size:16px}
  .sbox .err{text-align:center;color:#d23b3b;margin-top:8px}
  .spick{margin:12px 0 2px;text-align:center}
  .spick>span{font-size:14px;color:#6b6b78}
  .spt{display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:6px 2px}
  .spt button{flex:0 0 auto;width:64px;height:64px;border-radius:10px;border:3px solid transparent;padding:0;overflow:hidden;background:#eee;cursor:pointer}
  .spt button.on{border-color:var(--y)}
  .spt img{width:100%;height:100%;object-fit:cover;display:block}
  .snote{color:var(--muted);font-size:13px;text-align:center;margin:10px 0 0}
  .keep{color:var(--muted);font-size:13px;text-align:center;margin:10px 0 0}
  .sdone{display:flex;flex-direction:column;gap:4px;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px;margin-bottom:16px}
  .sdone.ok{background:rgba(249,203,56,.14);border-color:rgba(249,203,56,.5)}
  .sdone span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="pmad"></div>
<header><div id="brandTop"></div><h1 id="title">Fotogalerie</h1><p id="sub"></p></header>
<main id="main"><div class="box"><p>Lädt …</p></div></main>
<div id="light"><div id="lightMedia"></div><div class="row"><button class="btn" id="lDl">Herunterladen</button><button class="btn ghost" id="lClose">Schließen</button></div><div id="lInfo" style="color:#aaa;font-size:13px"></div>
  <button class="nav l" id="lPrev" aria-label="Vorheriges">‹</button><button class="nav r" id="lNext" aria-label="Nächstes">›</button></div>
<footer>Diese Seite ist nur über den persönlichen Link erreichbar. Bitte den Link nur an Gäste dieser Veranstaltung weitergeben.</footer>

<script src="config.js?v=20261018-9"></script>
<script src="icons.js?v=20261017-2"></script>
<script src="ad.js?v=20261020-2"></script>
<script src="shop.js?v=20261017-7"></script>
<script>
(function () {
  'use strict';
  const CFG = window.FOTOBOX_CONFIG || {}, $ = s => document.querySelector(s);
  const T = s => I18N.t(s, PM_LANG), LOC = I18N.info(PM_LANG).locale;
  I18N.watch(document.body, () => PM_LANG);
  document.title = T('Fotogalerie');
  // Sprache wählen (unten auf der Seite)
  const langSel = () => { const sel = document.createElement('select'); sel.className = 'langSel'; sel.setAttribute('translate', 'no'); sel.setAttribute('aria-label', 'Sprache');
    sel.innerHTML = I18N.LANGS.map(l => `<option value="${l.code}" ${l.code === PM_LANG ? 'selected' : ''}>${l.name}</option>`).join('');
    sel.onchange = () => { const u = new URL(location.href); u.searchParams.set('l', sel.value); location.replace(u.href); };
    document.querySelector('footer').appendChild(sel); };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const Q = new URLSearchParams(location.search), token = Q.get('g') || '', single = Q.get('f') || '', show = Q.get('show') === '1';
  const url = path => window.FOTOBOX_PHOTOS ? FOTOBOX_PHOTOS.url(path) : CFG.supabaseUrl + '/storage/v1/object/public/photos/' + String(path).split('/').map(encodeURIComponent).join('/');
  // Notfall-Kopie: antwortet der Foto-Speicher (Hetzner) nicht, das Bild bzw. Video von der Ersatzadresse laden
  document.addEventListener('error', e => { const el = e.target; if (!/^(IMG|VIDEO)$/.test(el?.tagName) || el.dataset.alt) return; const a = window.FOTOBOX_PHOTOS?.altSrc?.(el.currentSrc || el.src); if (a) { el.dataset.alt = '1'; el.src = a; } }, true);
  const fetchAny = async path => { // Herunterladen: erst Hetzner, sonst die Notfall-Kopie
    try { const r = await fetch(url(path)); if (r.ok) return r; } catch {}
    const a = window.FOTOBOX_PHOTOS?.alt?.(path); if (!a) throw new Error('nicht erreichbar'); const r = await fetch(a); if (!r.ok) throw new Error('nicht erreichbar'); return r;
  };
  let photos = [], current = 0, info = null;
  // Kein Photobox-Memories-Logo auf den Seiten der Gäste (White Label): Über und unter dem Foto steht das Logo des
  // Lizenz-Inhabers („Deine Werbung in der Galerie“), ohne Logo sein Firmenname, ohne Angaben bleibt die Stelle frei.
  let brand = null, band = false; // band: Werbeband oben ist sichtbar (zeigt Logo und Namen schon) → oben kein zweites Logo
  const capHtml = () => brand?.logo ? `<img src="${esc(brand.logo)}" alt="${esc(brand.name)}">` : brand?.name ? `<span translate="no">${esc(brand.name)}</span>` : '';
  const topHtml = () => band ? '' : brand?.logo ? `<img src="${esc(brand.logo)}" alt="${esc(brand.name)}">` : brand?.name ? `<b translate="no">${esc(brand.name)}</b>` : '';
  function applyBrand() {
    if ($('#brandTop')) $('#brandTop').innerHTML = topHtml();
    document.querySelectorAll('.polaroid .cap').forEach(c => { c.innerHTML = capHtml(); });
  }

  const box = html => { $('#main').innerHTML = `<div class="box">${html}</div>`; };
  // Werbung des Vermieters oben (Logo, Text, Webseite, E-Mail, Telefon …) – gepflegt im Dashboard unter „Meine Lizenzen“
  async function showAd(owner) {
    const b = window.PM_AD && owner ? await PM_AD.load(owner, CFG) : null;
    band = !show && !!b && PM_AD.has(b);
    if (!show && b?.privacy) { const a = document.createElement('a'); a.href = b.privacy; a.target = '_blank'; a.rel = 'noopener'; a.textContent = T('Datenschutz'); a.className = 'privLink'; $('footer').prepend(a); } // Datenschutzerklärung des Vermieters
    if (b && (b.logo || b.name)) { brand = b; applyBrand(); if (single && b.name) document.title = document.title.replace(/ – .*$/, '') + ' – ' + b.name; }
    if (!band) return;
    PM_AD.addCss(); $('#pmad').innerHTML = PM_AD.html(b);
  }
  async function fetchGallery(password) {
    const res = await fetch(CFG.supabaseUrl + '/rest/v1/rpc/gallery_public', { method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseAnonKey, Authorization: 'Bearer ' + CFG.supabaseAnonKey },
      body: JSON.stringify({ p_token: token, p_password: password || null }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  async function load(password) {
    if (!/^[0-9a-f]{16,64}$/i.test(token) || !CFG.supabaseUrl) return box('<h2>Galerie nicht gefunden</h2><p>Der Link ist unvollständig. Bitte den Link noch einmal öffnen.</p>');
    let r;
    try { r = await fetchGallery(password); }
    catch (e) { return box('<h2>Galerie nicht erreichbar</h2><p>Bitte die Internetverbindung prüfen und die Seite neu laden.</p>'); }
    if (r.name) { $('#title').textContent = r.name; $('#title').setAttribute('translate', 'no'); document.title = r.name + ' – ' + T('Fotogalerie'); }
    if (!r.ok) {
      if (r.error === 'password') {
        box(`<h2>Passwort erforderlich</h2><p>Diese Galerie ist geschützt.</p><form id="pwForm"><input type="password" id="pw" placeholder="Passwort" autocomplete="off" autofocus><div class="err" id="pwErr">${password ? 'Das Passwort stimmt nicht.' : ''}</div><button class="btn">Galerie öffnen</button></form>`);
        $('#pwForm').onsubmit = e => { e.preventDefault(); const v = $('#pw').value; if (v) { try { sessionStorage.setItem('pm-gal-' + token, v); } catch {} load(v); } };
        return;
      }
      return box(r.error === 'off' ? '<h2>Galerie nicht freigegeben</h2><p>Diese Galerie ist zurzeit nicht geöffnet. Bitte beim Veranstalter nachfragen.</p>'
        : '<h2>Galerie nicht gefunden</h2><p>Diesen Link gibt es nicht (mehr).</p>');
    }
    info = r; photos = r.photos || [];
    if (show) return slideshow(password);
    showAd(window.PM_AD?.ownerOf(photos[0]?.path));
    $('#sub').setAttribute('translate', 'no');
    $('#sub').textContent = [r.subtitle, r.date ? new Date(r.date).toLocaleDateString(LOC) : ''].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' · ');
    if (!photos.length) return box('<h2>Noch keine Fotos</h2><p>Sobald Fotos gemacht wurden, erscheinen sie hier. Einfach später noch einmal öffnen.</p>');
    $('#main').innerHTML = `<div class="bar"><span>${photos.length} ${photos.length === 1 ? 'Aufnahme' : 'Aufnahmen'}</span>${r.download_all ? '<button class="btn" id="zip">Alle herunterladen</button>' : ''}</div>
      <p class="keep" style="margin:-4px 0 12px"><span>Die Fotos bleiben 1 Jahr online und werden danach automatisch gelöscht.</span> <span>Speichere dir deine Lieblingsfotos rechtzeitig.</span></p>
      <div class="grid">${photos.map((p, i) => `<figure data-i="${i}"><img loading="lazy" src="${esc(url(p.thumb || p.path))}" alt="Foto ${i + 1}">${p.kind !== 'photo' ? `<span class="tag">${p.kind === 'video' ? 'Video' : 'GIF'}</span>` : ''}</figure>`).join('')}</div>`;
    $('.grid').onclick = e => { const f = e.target.closest('figure'); if (f) open(+f.dataset.i); };
    if ($('#zip')) $('#zip').onclick = zipAll;
  }

  const fileName = (p, i) => 'Foto-' + String(i + 1).padStart(3, '0') + '.' + (String(p.path).split('.').pop() || 'jpg');
  const save = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 20000); };
  function open(i) {
    current = (i + photos.length) % photos.length; const p = photos[current];
    $('#lightMedia').innerHTML = p.kind === 'video' ? `<video src="${esc(url(p.path))}" controls autoplay loop playsinline></video>` : `<img src="${esc(url(p.path))}" alt="">`;
    $('#lInfo').textContent = (current + 1) + ' von ' + photos.length;
    $('#lPrev').style.display = $('#lNext').style.display = photos.length > 1 ? '' : 'none';
    $('#light').classList.add('on');
  }
  const close = () => { $('#light').classList.remove('on'); $('#lightMedia').innerHTML = ''; };
  $('#lClose').onclick = close; $('#lPrev').onclick = () => open(current - 1); $('#lNext').onclick = () => open(current + 1);
  $('#light').onclick = e => { if (e.target.id === 'light') close(); };
  document.addEventListener('keydown', e => { if (!$('#light').classList.contains('on')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') open(current - 1); if (e.key === 'ArrowRight') open(current + 1); });
  $('#lDl').onclick = async () => {
    const p = photos[current], b = $('#lDl'); b.disabled = true;
    try { const r = await fetchAny(p.path); save(await r.blob(), fileName(p, current)); }
    catch { window.open(url(p.path), '_blank'); } // Notlösung: Bild im neuen Tab, dort lange drücken und speichern
    b.disabled = false;
  };
  async function zipAll() {
    const b = $('#zip'); b.disabled = true;
    try {
      if (!window.JSZip) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      const zip = new window.JSZip();
      for (let i = 0; i < photos.length; i++) { b.textContent = `Lade ${i + 1} von ${photos.length} …`; try { const r = await fetchAny(photos[i].path); zip.file(fileName(photos[i], i), await r.blob()); } catch {} }
      b.textContent = 'Packe Datei …';
      save(await zip.generateAsync({ type: 'blob', compression: 'STORE' }), (info.name || 'Fotos').replace(/[^\wäöüÄÖÜß \-]/g, '_') + '.zip');
    } catch { alert('Das Herunterladen hat nicht geklappt. Bitte später noch einmal versuchen.'); }
    b.disabled = false; b.textContent = 'Alle herunterladen';
  }

  // Foto-Shop unter dem Einzelfoto: Poster, Leinwand, Tasse … mit dem eigenen Foto (Druck und Versand: Gelato, Bezahlung: Stripe).
  // Produkte, Preise und Rechtstexte kommen vom Server (Funktion photo-shop); ohne Freigabe dort erscheint hier nichts.
  const shopCall = body => fetch(CFG.supabaseUrl + '/functions/v1/photo-shop', { method: 'POST', body: JSON.stringify(body),
    headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseAnonKey } })
    .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; });
  function orderNote() {
    const k = Q.get('bestellt'); if (k !== 'ok' && k !== 'abbruch') return '';
    try { const u = new URL(location.href); u.searchParams.delete('bestellt'); history.replaceState(null, '', u.href); } catch {}
    return k === 'ok'
      ? '<div class="sdone ok"><b>Danke für deine Bestellung!</b><span>Du bekommst gleich eine Bestätigung per E-Mail. Dein Foto wird jetzt gedruckt und zu dir geschickt.</span></div>'
      : '<div class="sdone"><b>Bestellung abgebrochen</b><span>Es wurde nichts berechnet. Du kannst jederzeit neu bestellen.</span></div>';
  }
  async function showShop(src) {
    if (!window.PM_SHOP || !/\.(jpe?g|png)$/i.test(single)) return;
    const testing = Q.get('shop') === 'test';
    let s; try { s = await shopCall({ action: 'info', path: single, test: testing }); } catch { return; }
    const im = $('.polaroid img');
    if (!s?.products?.length || !im || $('#shop')) return;
    PM_SHOP.addCss();
    const eur = c => PM_SHOP.price(c, LOC);
    // Gedruckt wird das Original-Foto ohne Rahmen (bei mehreren Fotos wählt der Gast). Ältere Fotos ohne Original: das fertige Foto.
    const n = Math.min(8, Math.max(0, s.originals | 0)), oBase = single.replace(/\.(jpe?g|png)$/i, '');
    const thumbOf = k => k ? url(`${oBase}_o${k}t.jpg`) : src;
    const isLand = u => new Promise(r => { const i = new Image(); i.onload = () => r(i.naturalWidth > i.naturalHeight); i.onerror = () => r(true); i.src = u; });
    let pick = n ? 1 : 0, land = pick ? await isLand(thumbOf(1)) : im.naturalWidth > im.naturalHeight;
    const mk = p => PM_SHOP.mockup(p.type, thumbOf(pick), land);
    let names = s.countries.join(', ');
    try { const dn = new Intl.DisplayNames([LOC], { type: 'region' }); names = s.countries.map(c => dn.of(c)).join(', '); } catch {}
    const L = s.legal, link = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : '';
    const vatTxt = s.vat === 0 ? '<span>Kein Ausweis der Umsatzsteuer (§ 19 UStG).</span>' : '<span>Alle Preise inkl. MwSt.</span>';
    const sec = document.createElement('section'); sec.className = 'shop'; sec.id = 'shop';
    sec.innerHTML = `${s.test ? '<div class="stest">Testmodus – nur über den Test-Link sichtbar</div>' : ''}
      <h2>Dein Foto als Andenken</h2><p class="lead">Gedruckt und direkt zu dir nach Hause geschickt.</p>
      <div class="sgrid">${s.products.map(p => `<button class="sp" type="button" data-p="${esc(p.id)}">${mk(p)}<b>${esc(p.name)}</b><span translate="no">${eur(p.cents)}</span></button>`).join('')}</div>
      ${n ? '<p class="snote">Gedruckt wird dein Foto ohne Rahmen in voller Qualität.</p>' : ''}
      <p class="slegal">${vatTxt} · ${s.ship ? `<span>Versand:</span> <b translate="no">${eur(s.ship)}</b>` : '<span>Kostenloser Versand</span>'} · <span>Lieferung nach:</span> <span translate="no">${esc(names)}</span></p>
      <p class="slegal">${s.seller ? `<span>Verkäufer:</span> <span translate="no">${esc(s.seller)}</span> · ` : ''}${[link(L.agb, 'AGB'), link(L.privacy, 'Datenschutz'), link(L.imprint, 'Impressum'), link(L.withdrawal, 'Widerrufsbelehrung')].filter(Boolean).join(' · ')}</p>`;
    $('#main').appendChild(sec);
    let dlg = $('#sdlg');
    if (!dlg) {
      dlg = document.createElement('div'); dlg.id = 'sdlg'; dlg.className = 'sdlg'; dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true');
      dlg.innerHTML = `<div class="sbox"><button class="sx" type="button" aria-label="Schließen">×</button><div id="sdMk"></div><h3 id="sdName" translate="no"></h3><div id="sdPick"></div>
        <div class="sdrow"><span>Menge</span><div class="qty"><button type="button" data-q="-1" aria-label="Weniger">−</button><b id="sdQty">1</b><button type="button" data-q="1" aria-label="Mehr">+</button></div></div>
        <div class="sdrow"><span>Preis</span><b id="sdPrice" translate="no"></b></div>
        <div class="sdrow"><span>Versand</span><b id="sdShip" translate="no"></b></div>
        <div class="sdrow tot"><span>Gesamt</span><b id="sdTot" translate="no"></b></div>
        <p class="fine">${vatTxt} <span>Lieferadresse und Bezahlung auf der nächsten Seite.</span> <span>Die Rechnung kommt per E-Mail.</span></p>
        <p class="fine">Wird mit deinem Foto angefertigt – deshalb gibt es kein Widerrufsrecht.</p>
        <div class="err" id="sdErr"></div><button class="btn" type="button" id="sdGo">Weiter zur Bezahlung</button></div>`;
      document.body.appendChild(dlg);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') dlg.classList.remove('on'); });
    }
    let cur = null, qty = 1;
    const picker = () => n > 1 ? `<div class="spick"><span>Welches Foto?</span><div class="spt">${Array.from({ length: n }, (_, i) =>
      `<button type="button" data-pick="${i + 1}" class="${i + 1 === pick ? 'on' : ''}" aria-label="Foto ${i + 1}"><img src="${esc(thumbOf(i + 1))}" alt=""></button>`).join('')}</div></div>` : '';
    // Druckfläche zum Selbst-Platzieren (Printful): Der Gast verschiebt sein Foto mit dem Finger und zoomt mit zwei Fingern,
    // dem Mausrad oder dem Regler. place = { x, y, w }: linke Kante, obere Kante, Breite als Anteile der Druckfläche (so rechnet
    // auch der Server); die Höhe ergibt sich aus dem Seitenverhältnis des Fotos. Ohne Druckfläche (Gelato): nur die Vorschau.
    let place = null, ia = 1;
    const A = () => cur.area[0] / cur.area[1], hRel = () => place.w * A() / ia;
    const zoomRange = () => [Math.min(1, ia / A()), Math.max(1, ia / A()) * 3]; // von „ganz sichtbar“ bis 3 × „füllt die Fläche“ (sonst unscharf)
    const sliderOf = w => { const [a, z] = zoomRange(); return Math.round(100 * Math.log(w / a) / Math.log(z / a)); };
    const wOf = v => { const [a, z] = zoomRange(); return a * Math.pow(z / a, v / 100); };
    const defPlace = () => {
      if (cur.type === 'mug') { // wie bisher: volle Höhe auf einer Hälfte der Tasse
        let h = 1, w = ia / A(); if (w > .625) { w = .625; h = w * A() / ia; }
        const cx = cur.side === 'right' ? .75 : .25; return { x: Math.min(1 - w, Math.max(0, cx - w / 2)), y: (1 - h) / 2, w };
      }
      const w = Math.max(1, ia / A()), h = w * A() / ia; return { x: (1 - w) / 2, y: (1 - h) / 2, w }; // füllt die Fläche, mittig
    };
    const keepIn = () => { const cx = place.x + place.w / 2, cy = place.y + hRel() / 2; // Bildmitte bleibt auf der Fläche
      place.x += Math.min(1, Math.max(0, cx)) - cx; place.y += Math.min(1, Math.max(0, cy)) - cy; };
    const drawPlace = () => { const im = $('#pedImg'); if (!im || !place) return;
      Object.assign(im.style, { left: place.x * 100 + '%', top: place.y * 100 + '%', width: place.w * 100 + '%', height: hRel() * 100 + '%' });
      $('#pedZoom').value = sliderOf(place.w); };
    const zoomTo = w => { const [a, z] = zoomRange(); w = Math.min(z, Math.max(a, w));
      const cx = place.x + place.w / 2, cy = place.y + hRel() / 2; place.w = w; place.x = cx - w / 2; place.y = cy - hRel() / 2; keepIn(); drawPlace(); };
    const showEditor = async () => {
      place = null;
      if (!cur.area) { $('#sdMk').innerHTML = mk(cur); return; }
      $('#sdMk').innerHTML = `<div class="ped${cur.type === 'mug' ? ' mug' : ''}" id="ped" style="aspect-ratio:${+cur.area[0]} / ${+cur.area[1]}"><img id="pedImg" src="${esc(thumbOf(pick))}" alt="" draggable="false"></div>
        <div class="pedbar"><span aria-hidden="true">−</span><input type="range" id="pedZoom" min="0" max="100" aria-label="Zoom"><span aria-hidden="true">+</span><button type="button" id="pedReset">Zurücksetzen</button></div>
        <p class="fine">Verschiebe dein Foto mit dem Finger und zoome mit zwei Fingern oder dem Regler – so wird es gedruckt.</p>${cur.type === 'mug' ? '<p class="fine">Die Fläche geht einmal rund um die Tasse – links und rechts ist der Henkel.</p>' : ''}`;
      const im = $('#pedImg'); await im.decode?.().catch(() => {});
      ia = im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : land ? 1.5 : 2 / 3;
      place = defPlace(); drawPlace();
      const ped = $('#ped'), pts = new Map(); let span = 0;
      ped.onpointerdown = e => { ped.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); span = 0; };
      ped.onpointermove = e => {
        const prev = pts.get(e.pointerId); if (!prev) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
        if (pts.size === 1) { const r = ped.getBoundingClientRect(); place.x += (e.clientX - prev[0]) / r.width; place.y += (e.clientY - prev[1]) / r.height; keepIn(); drawPlace(); }
        else { const [p, q] = [...pts.values()], d = Math.hypot(p[0] - q[0], p[1] - q[1]); if (span) zoomTo(place.w * d / span); span = d; }
      };
      ped.onpointerup = ped.onpointercancel = e => { pts.delete(e.pointerId); span = 0; };
      ped.onwheel = e => { e.preventDefault(); zoomTo(place.w * Math.exp(-e.deltaY / 400)); };
      $('#pedZoom').oninput = e => zoomTo(wOf(+e.target.value));
      $('#pedReset').onclick = () => { place = defPlace(); drawPlace(); };
    };
    const sum = () => { $('#sdQty').textContent = qty; $('#sdPrice').textContent = eur(cur.cents * qty); $('#sdShip').textContent = eur(s.ship); $('#sdTot').textContent = eur(cur.cents * qty + s.ship); };
    sec.querySelector('.sgrid').onclick = e => {
      const b = e.target.closest('[data-p]'); cur = b && s.products.find(p => p.id === b.dataset.p); if (!cur) return;
      qty = 1; showEditor(); $('#sdPick').innerHTML = picker(); $('#sdErr').textContent = '';
      $('#sdName').textContent = T(cur.name); // Standardnamen übersetzt, eigene Namen wie eingetragen
      sum(); $('#sdGo').disabled = false; dlg.classList.add('on');
    };
    dlg.onclick = async e => {
      if (e.target === dlg || e.target.closest('.sx')) return dlg.classList.remove('on');
      const pk = e.target.closest('[data-pick]');
      if (pk) { // anderes Foto gewählt: Vorschau im Fenster und auf allen Produkten anpassen
        pick = +pk.dataset.pick; land = await isLand(thumbOf(pick));
        showEditor(); $('#sdPick').innerHTML = picker();
        sec.querySelectorAll('.sp').forEach(c => { const p = s.products.find(x => x.id === c.dataset.p); if (p) c.querySelector('.mk').outerHTML = mk(p); });
        return;
      }
      const q = e.target.closest('[data-q]'); if (q) { qty = Math.min(10, Math.max(1, qty + +q.dataset.q)); sum(); }
    };
    $('#sdGo').onclick = async () => {
      const b = $('#sdGo'); b.disabled = true; $('#sdErr').textContent = '';
      try { const j = await shopCall({ action: 'checkout', path: single, product: cur.id, qty, pick, lang: PM_LANG, test: testing, ...(place ? { place } : {}) }); location.href = j.url; }
      catch (err) { $('#sdErr').textContent = T(err.message || 'Das hat nicht geklappt. Bitte noch einmal versuchen.'); b.disabled = false; }
    };
  }
  // Einzelnes Foto (QR-Code an der Fotobox): nur dieses eine Bild mit „Herunterladen“
  function showSingle() {
    if (!/^(hz\/)?[0-9a-f-]{36}\/[0-9a-f-]{36}\/[0-9a-f-]{36}\.(jpe?g|png|gif|mp4|webm)$/i.test(single) || !CFG.supabaseUrl) return box('<h2>Foto nicht gefunden</h2><p>Der Link ist unvollständig. Bitte den QR-Code noch einmal scannen.</p>');
    const vid = /\.(mp4|webm)$/i.test(single), u = url(single), what = vid ? 'Video' : 'Foto';
    const ext = single.split('.').pop().toLowerCase(), type = vid ? 'video/' + ext : ext === 'gif' ? 'image/gif' : ext === 'png' ? 'image/png' : 'image/jpeg';
    document.body.classList.add('solo');
    document.title = T(vid ? 'Dein Video' : 'Dein Foto');
    document.querySelector('header').innerHTML = `<div id="brandTop"></div><h1 id="title">${vid ? 'Dein Video' : 'Dein Foto'}</h1><p id="sub">Einen Moment bitte …</p>`;
    showAd(window.PM_AD?.ownerOf(single));
    document.querySelector('footer').innerHTML = '<span>Danke, dass du dabei warst!</span>'; langSel();
    const I = (n, z = 20) => window.ICON ? ICON(n, z) : '';
    // Probe mit eigener Adresse je Versuch (?t=…), damit kein zwischengespeichertes „nicht gefunden“ hängen bleibt
    const alt = window.FOTOBOX_PHOTOS?.alt?.(single) || '';
    const ready = (base = u) => new Promise(res => {
      const t = base + '?t=' + Date.now(), el = vid ? document.createElement('video') : new Image();
      let fin = false; const done = ok => { if (fin) return; fin = true; el.onload = el.onerror = el.onloadedmetadata = null; if (vid) el.removeAttribute('src'); res(ok ? t : null); };
      if (vid) { el.preload = 'metadata'; el.muted = true; el.onloadedmetadata = () => done(true); } else el.onload = () => done(true);
      el.onerror = () => done(false); setTimeout(() => done(false), 20000); el.src = t;
    });
    let blob = null; const getBlob = async src => blob || (blob = await fetch(src).then(r => { if (!r.ok) throw 0; return r.blob(); }));
    const fileName = () => [String(brand?.name || '').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, ''), what].filter(Boolean).join('-') + '.' + ext;
    const canShare = f => { try { return !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch { return false; } };
    const show = src => {
      const shareOk = canShare(new File([new Blob([''], { type })], fileName(), { type }));
      $('#title').textContent = vid ? 'Dein Video ist da!' : 'Dein Foto ist da!'; $('#sub').textContent = 'Speichern, teilen, Erinnerung behalten.';
      $('#main').innerHTML = `${orderNote()}<div class="polaroid">${vid ? `<video src="${esc(src)}" controls autoplay loop playsinline muted></video>` : `<img src="${esc(src)}" alt="Dein Foto">`}
          <div class="cap">${capHtml()}</div></div>
        <div class="acts"><button class="btn" id="oneDl">${I('download')} ${vid ? 'Video speichern' : 'Foto speichern'}</button>${shareOk ? `<button class="btn ghost" id="oneSh">${I('share')} Teilen</button>` : ''}</div>
        <p class="tip">${vid ? 'Tipp: Nach dem Speichern findest du das Video in deinen Downloads bzw. in der Fotos-App.' : 'Tipp: Auf dem iPhone das Foto gedrückt halten → „Zu Fotos hinzufügen“.'}</p>
        <p class="keep">${vid ? '<span>Dein Video bleibt 1 Jahr online und wird danach automatisch gelöscht.</span> <span>Speichere es dir am besten gleich.</span>'
          : '<span>Dein Foto bleibt 1 Jahr online und wird danach automatisch gelöscht.</span> <span>Speichere es dir am besten gleich.</span>'}</p>`;
      $('#oneDl').onclick = async () => { const b = $('#oneDl'); b.disabled = true;
        try { save(await getBlob(src), fileName()); } catch { window.open(src, '_blank'); }
        b.disabled = false; };
      if (shareOk) $('#oneSh').onclick = async () => {
        try { const f = new File([await getBlob(src)], fileName(), { type }); await navigator.share({ files: [f], ...(brand?.name ? { title: brand.name } : {}) }); }
        catch (e) { if (e?.name !== 'AbortError') window.open(src, '_blank'); }
      };
      if (!vid) showShop(src);
    };
    const wait = async n => {
      const src = await ready() || (alt ? await ready(alt) : null); if (src) return show(src); // sonst die Notfall-Kopie
      $('#main').innerHTML = `<div class="polaroid"><div class="ph"><div class="spin"></div><b>${vid ? 'Dein Video ist gleich da …' : 'Dein Foto ist gleich da …'}</b><small>${n < 60
        ? 'Es wird gerade von der Fotobox hochgeladen. Die Seite zeigt es von selbst an.'
        : 'Das dauert gerade etwas länger. Die Seite schaut weiter nach – du kannst diesen Link auch später noch einmal öffnen.'}</small></div>
        <div class="cap">${capHtml()}</div></div>`;
      setTimeout(() => wait(n + 1), n < 60 ? 3000 : 15000);
    };
    wait(0);
  }
  // Slideshow: zeigt die Fotos des Ereignisses nacheinander im Vollbild, neue Fotos kommen von selbst dazu
  function slideshow(password) {
    document.body.classList.add('show');
    $('#main').innerHTML = '<div id="ss"><img id="ssA" alt=""><img id="ssB" alt=""><div class="hint" id="ssHint"></div></div>';
    let i = 0, flip = false;
    const pics = () => photos.filter(p => p.kind !== 'video');
    const next = () => {
      const list = pics(); $('#ssHint').textContent = list.length ? '' : 'Noch keine Fotos – sobald Fotos gemacht wurden, erscheinen sie hier.';
      if (!list.length) return;
      const p = list[i % list.length], el = $(flip ? '#ssA' : '#ssB'), other = $(flip ? '#ssB' : '#ssA'), im = new Image(); i++;
      im.onload = () => { el.src = im.src; el.classList.add('on'); other.classList.remove('on'); flip = !flip; };
      im.src = url(p.path);
    };
    next(); setInterval(next, 6000);
    setInterval(async () => { try { const r = await fetchGallery(password); if (r.ok) { const had = photos.length; photos = r.photos || []; if (photos.length > had) i = 0; } } catch {} }, 30000); // neue Fotos zuerst
    $('#ss').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
  }

  let saved = ''; try { saved = sessionStorage.getItem('pm-gal-' + token) || ''; } catch {}
  if (single) showSingle(); else { langSel(); load(saved); }
})();
</script>
</body>
