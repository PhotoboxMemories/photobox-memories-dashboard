<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fotogalerie</title>
<script>window.I18N_V = '20261023-2';</script>
<script src="i18n.js?v=20261017-2"></script>
<script>// Sprache: vom QR-Code der Fotobox (?l=…), sonst die des Handys
(function () { var q = new URLSearchParams(location.search).get('l'), l = I18N.CODES.indexOf(q) >= 0 ? q : I18N.guess('en');
  window.PM_LANG = l; document.documentElement.lang = l; if (l !== 'de') document.write('<script src="lang/' + l + '.js?v=' + I18N_V + '"><\/script>'); })();</script>
<link rel="stylesheet" href="fonts-fredoka/fredoka.css">
<style>
  :root{--y:#F9CB38;--k:#1D1D1B;--bg:#111110;--card:#1c1c1f;--line:#2e2e33;--muted:#a3a3ad}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#fff;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:26px 16px 18px;text-align:center;border-bottom:3px solid var(--y);background:var(--k)}
  header h1{margin:8px 0 4px;font-size:clamp(24px,5vw,40px);line-height:1.15;overflow-wrap:anywhere}
  header p{margin:0;color:var(--muted)}
  main{max-width:1200px;margin:0 auto;padding:16px}
  .bar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-size:14px}
  .btn{background:var(--y);color:var(--k);border:0;border-radius:999px;padding:11px 20px;font:700 15px system-ui,sans-serif;cursor:pointer}
  .btn.ghost{background:#2a2a2e;color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  @media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}}
  .grid figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);cursor:zoom-in}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  .grid .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);font-size:11px;border-radius:6px;padding:2px 6px}
  .grid figure video{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .grid .tag.msg{left:50%;top:50%;bottom:auto;translate:-50% -50%;width:44px;height:44px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(0,0,0,.55);border:2px solid #fff}
  .grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12.5px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ghd{font:600 19px Fredoka,system-ui,sans-serif;margin:18px 0 10px}.ghd small{color:var(--muted,#a3a3ad);font:500 14px system-ui,sans-serif}
  .box{max-width:440px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
  .box h2{margin:0 0 8px}
  .box p{color:var(--muted);margin:0 0 16px}
  .box input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0f0f12;color:#fff;font:inherit;margin-bottom:12px;text-align:center}
  .err{color:#ff8f8f;min-height:1.4em;font-size:14px}
  #light{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
  #light.on{display:flex}
  #light img,#light video{max-width:96vw;max-height:76vh;border-radius:8px;background:#000}
  #light .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #light .nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;padding:0;font-size:26px;background:rgba(255,255,255,.9);color:var(--k);border:0;cursor:pointer}
  #light .nav.l{left:10px}#light .nav.r{right:10px}
  footer{text-align:center;color:#6f6f78;font-size:12px;padding:26px 16px 34px}
  footer .privLink{display:block;margin-bottom:8px;color:inherit;text-decoration:underline}
  .langSel{display:block;margin:12px auto 0;background:transparent;color:#8a8a92;border:1px solid #3a3a40;border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
  .langSel option{color:#111}
  .one{text-align:center}.one img,.one video{max-width:100%;max-height:70vh;border-radius:10px;background:#000}
  .one p{color:var(--muted);font-size:14px}
  /* Slideshow (z. B. für einen zweiten Bildschirm oder Fernseher) */
  body.show header,body.show footer{display:none}
  #ss{position:fixed;inset:0;background:#000;cursor:pointer}
  #ss img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.2s}
  #ss img.on{opacity:1}
  #ss .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#777;font-size:13px}
  /* Einzelfoto (QR-Code an der Fotobox) – im Stil von Photobox Memories */
  body.solo{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,rgba(249,203,56,.28),rgba(249,203,56,0) 60%),#121211}
  body.solo header{background:none;border:0;padding:28px 16px 6px}
  body.solo header h1{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:clamp(26px,7vw,38px);margin:18px 0 2px}
  body.solo header p{font-size:15px}
  body.solo main{max-width:560px;padding:14px 18px 8px}
  .polaroid{background:#fff;border-radius:18px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
  .polaroid img,.polaroid video{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain;border-radius:10px;background:#f2f2f2}
  .polaroid .cap{margin-top:12px;text-align:center;font:600 16px Fredoka,system-ui,sans-serif;color:#1D1D1B;overflow-wrap:anywhere}
  .polaroid .cap:empty{display:none}
  .polaroid .cap img{display:inline-block;width:auto;height:44px;max-width:200px;max-height:none;object-fit:contain;vertical-align:middle;border-radius:0;background:none}
  #brandTop:not(:empty){margin-bottom:6px}
  #brandTop img{display:inline-block;height:64px;max-width:220px;object-fit:contain;border-radius:12px;background:#fff;padding:6px}
  #brandTop b{font:600 20px Fredoka,system-ui,sans-serif;color:var(--y);overflow-wrap:anywhere}
  .ph{aspect-ratio:2/3;max-height:60vh;margin:0 auto;border-radius:10px;background:linear-gradient(100deg,#eee 30%,#f8f8f8 50%,#eee 70%) 0 0/300% 100%;animation:shim 1.4s linear infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#555;padding:20px;text-align:center}
  .ph b{font:600 18px Fredoka,system-ui,sans-serif;color:#1D1D1B}
  .ph small{font-size:13px;color:#777;max-width:280px}
  .acts{display:flex;gap:10px;margin:20px 0 8px}
  .acts .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 18px;font-size:16px;box-shadow:0 6px 18px rgba(249,203,56,.25)}
  .acts .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);box-shadow:none}
  .tip{color:var(--muted);font-size:13px;text-align:center;margin:6px 0 0}
  body.solo footer{padding:22px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#8a8a92}
  .spin{width:40px;height:40px;border:4px solid rgba(0,0,0,.1);border-top-color:#F9CB38;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}} @keyframes shim{to{background-position:-300% 0}} @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
  @media(prefers-reduced-motion:reduce){.polaroid,.ph,.spin{animation:none}}
  /* Foto-Shop unter dem Einzelfoto (Druck über Printful/Gelato, Bezahlung über Stripe) */
  .shop{margin:30px 0 6px;padding:20px 14px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px}
  .shop h2{margin:0;font:600 22px Fredoka,system-ui,sans-serif;text-align:center;outline:none}
  .shop .lead{margin:4px 0 16px;text-align:center;color:var(--muted);font-size:14px}
  .sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .sp{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;color:#1D1D1B;border:0;border-radius:14px;padding:8px 8px 11px;font:inherit;cursor:pointer;transition:transform .15s}
  .sp:hover{transform:translateY(-2px)}
  .sp b{font-size:14px;line-height:1.25;margin-top:7px;padding:0 2px}
  .sp span{font-size:14px;color:#7a5c00;font-weight:700;padding:0 2px}
  .sp.sph{cursor:default;pointer-events:none}
  .sph .mk{background:linear-gradient(100deg,#eee 30%,#f8f8f8 50%,#eee 70%) 0 0/300% 100%;animation:shim 1.4s linear infinite}
  .sph b,.sph span{display:block;height:12px;border-radius:6px;background:#eee;margin:9px 2px 0}.sph span{width:45%;margin-top:6px}
  .sgo{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;margin:0 0 6px;padding:14px 18px;font-size:15px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18)}
  .sgo[hidden]{display:none}
  .slegal{color:#8a8a92;font-size:12px;text-align:center;margin:12px 0 0;line-height:1.7}
  .slegal a{color:#c9c9cf}
  .stest{background:var(--y);color:var(--k);font-weight:700;font-size:13px;text-align:center;border-radius:10px;padding:6px 10px;margin-bottom:12px}
  /* Bestellfenster: am Handy im Vollbild (Kopf oben, Fußleiste mit Preis und Bezahlen immer sichtbar), sonst als Fenster */
  .sdlg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:none;align-items:stretch;justify-content:center;overscroll-behavior:contain}
  .sdlg.on{display:flex}
  .sbox{position:relative;display:flex;flex-direction:column;width:100%;height:100%;height:100dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;color:#1D1D1B}
  @media(min-width:600px) and (min-height:620px){.sdlg{align-items:center;padding:16px}.sbox{max-width:500px;height:auto;max-height:94vh;max-height:94dvh;border-radius:20px}}
  .sbox button{touch-action:manipulation}
  .shd{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;padding-top:calc(8px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid #eee}
  .sti{flex:1;min-width:0;display:flex;flex-direction:column}
  .shd h3{margin:0;font:600 19px/1.2 Fredoka,system-ui,sans-serif;overflow-wrap:anywhere}
  .sunit{font-size:14px;font-weight:700;color:#7a5c00}
  .sx{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.07);font-size:24px;line-height:1;cursor:pointer;color:#1D1D1B}
  .sbody{flex:1 0 auto;padding:10px 16px 14px}
  .sbody .mk{max-width:300px;margin:4px auto 0}
  /* Arbeitsfläche so groß, dass sie beim Öffnen ganz zwischen Kopf und Fußleiste passt (mit Fotoauswahl darüber kleiner) */
  .swork{position:relative;width:100%;max-width:55vh;max-width:min(55dvh,max(160px,calc(100dvh - 215px)));margin:4px auto 0}
  #sdPick:not(:empty)+#sdMk .swork{max-width:min(55dvh,max(160px,calc(100dvh - 320px)))}
  @media(min-width:600px) and (min-height:620px){.swork{max-width:min(55dvh,calc(94dvh - 215px))}#sdPick:not(:empty)+#sdMk .swork{max-width:min(55dvh,calc(94dvh - 320px))}}
  .sreal{display:block;width:100%;height:auto;border-radius:14px;background:#efeae1;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .sreal:active{cursor:grabbing}
  .sreal:focus-visible{outline:3px solid #E2A800;outline-offset:2px}
  .smini{position:absolute;left:3%;top:3%;width:36%;height:auto;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.3);pointer-events:none}
  .shint{position:absolute;left:50%;top:4%;transform:translateX(-50%);width:max-content;max-width:92%;background:rgba(29,29,27,.84);color:#fff;font-size:13px;line-height:1.3;text-align:center;border-radius:999px;padding:7px 14px;pointer-events:none}
  .sload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .sfail{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 0;padding:26px 16px;border-radius:14px;background:#f1eee6;text-align:center;color:#4a4a52;font-size:14px}
  .sfail p{margin:0}
  .sbox .sfail .btn{width:auto;min-height:44px;background:#1D1D1B;color:#fff;padding:10px 20px;font-size:15px}
  .spre{display:flex;gap:6px;margin:10px 0 0;padding:4px;background:#f1eee6;border-radius:12px}
  .spre[hidden]{display:none}
  .spre button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;font:600 14px system-ui,sans-serif;color:#4a4a52;cursor:pointer;padding:6px 8px}
  .spre button[aria-pressed="true"]{background:#fff;color:#1D1D1B;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .szoom{display:flex;align-items:center;gap:8px;margin-top:6px;color:#6b6b78}
  .szoom input{flex:1;min-width:0;height:44px;margin:0;accent-color:#E2A800}
  .szoom button{min-height:44px;border:1px solid #ddd;background:#f6f6f6;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:#1D1D1B}
  .sq{margin:6px 0 0;font-size:13px;border-radius:8px;padding:6px 10px}
  .sq:empty{display:none}
  .sq.warn{background:#fff4cc;color:#6b4f00}
  .sq.bad{background:#fdeaea;color:#a1201b}
  .fine{font-size:12px;color:#6b6b78;margin:8px 0 0;text-align:center}
  .sfoot{position:sticky;bottom:0;z-index:3;background:#fff;border-top:1px solid #eee;padding:10px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 16px rgba(0,0,0,.06)}
  .sfrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty b{min-width:1.6em;text-align:center;font-size:17px}
  .qty button{width:44px;height:44px;border-radius:50%;border:1px solid #ddd;background:#f6f6f6;font-size:20px;line-height:1;cursor:pointer;color:#1D1D1B}
  .qty button[aria-disabled="true"]{opacity:.4;cursor:default}
  .stot{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
  .stot small{font-size:12px;color:#6b6b78}
  .stot b{font-size:19px}
  .sbox .btn{width:100%;min-height:50px;margin-top:10px;padding:13px 15px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
  .sbox .btn[aria-busy="true"]{opacity:.8;cursor:progress}
  .sbox .err{text-align:center;color:#c0262d;margin-top:8px;min-height:0;font-size:14px}
  .sbox .err:empty{display:none}
  .sbox .err.info{color:#6b4f00;background:#fff4cc;border-radius:8px;padding:7px 10px}
  .sspin{flex:none;width:18px;height:18px;border:2.5px solid rgba(29,29,27,.25);border-top-color:#1D1D1B;border-radius:50%;animation:sp .8s linear infinite}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  .spick{margin:2px 0 6px;text-align:center}
  .spick>span{font-size:14px;color:#6b6b78}
  .spt{display:flex;gap:8px;justify-content:flex-start;overflow-x:auto;padding:6px 2px}
  .spt button:first-child{margin-left:auto}.spt button:last-child{margin-right:auto} /* mittig, bei Überlauf aber von links scrollbar */
  .spt button{flex:0 0 auto;width:64px;height:64px;border-radius:10px;border:3px solid transparent;padding:0;overflow:hidden;background:#eee;cursor:pointer}
  .spt button.on{border-color:var(--y)}
  .spt img{width:100%;height:100%;object-fit:cover;display:block}
  @media(max-height:560px) and (max-aspect-ratio:5/4){.spt button{width:52px;height:52px}} /* kleine Handys: mehr Platz für die Arbeitsfläche */
  @media(prefers-reduced-motion:reduce){.sph .mk,.sspin{animation:none}.sp{transition:none}}
  /* Handy quer (niedriges Fenster): Kopf und Fußleiste scrollen mit, links die Arbeitsfläche, rechts die Bedienung */
  @media(max-height:500px) and (min-aspect-ratio:5/4){
    .shd,.sfoot{position:static}
    .sbody{display:grid;grid-template-columns:min(calc(100vh - 86px),55%) minmax(0,1fr);grid-template-columns:min(calc(100dvh - 86px),55%) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:18px;align-items:start}
    .sbody>#sdMk{grid-column:1;grid-row:1/-1}
    .sbody>:not(#sdMk){grid-column:2}
    .swork,#sdPick:not(:empty)+#sdMk .swork,.sbody .mk{max-width:none}
    .szoom{flex-wrap:wrap}.szoom input{min-width:110px}
  }
  .snote{color:var(--muted);font-size:13px;text-align:center;margin:10px 0 0}
  .keep{color:var(--muted);font-size:13px;text-align:center;margin:10px 0 0}
  .sdone{display:flex;flex-direction:column;gap:4px;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px;margin-bottom:16px}
  .sdone.ok{background:rgba(249,203,56,.14);border-color:rgba(249,203,56,.5)}
  .sdone span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="pmad"></div>
<header><div id="brandTop"></div><h1 id="title">Fotogalerie</h1><p id="sub"></p></header>
<main id="main"><div class="box"><p>Lädt …</p></div></main>
<div id="light"><div id="lightMedia"></div><div class="row"><button class="btn" id="lDl">Herunterladen</button><button class="btn ghost" id="lClose">Schließen</button></div><div id="lInfo" style="color:#aaa;font-size:13px"></div>
  <button class="nav l" id="lPrev" aria-label="Vorheriges">‹</button><button class="nav r" id="lNext" aria-label="Nächstes">›</button></div>
<footer>Diese Seite ist nur über den persönlichen Link erreichbar. Bitte den Link nur an Gäste dieser Veranstaltung weitergeben.</footer>

<script src="config.js?v=20261025-1"></script>
<script src="icons.js?v=20261017-2"></script>
<script src="ad.js?v=20261022-1"></script>
<script src="shop.js?v=20261023-2"></script>
<script>
(function () {
  'use strict';
  const CFG = window.FOTOBOX_CONFIG || {}, $ = s => document.querySelector(s);
  const T = s => I18N.t(s, PM_LANG), LOC = I18N.info(PM_LANG).locale;
  I18N.watch(document.body, () => PM_LANG);
  document.title = T('Fotogalerie');
  // Sprache wählen (unten auf der Seite)
  const langSel = () => { const sel = document.createElement('select'); sel.className = 'langSel'; sel.setAttribute('translate', 'no'); sel.setAttribute('aria-label', 'Sprache');
    sel.innerHTML = I18N.LANGS.map(l => `<option value="${l.code}" ${l.code === PM_LANG ? 'selected' : ''}>${l.name}</option>`).join('');
    sel.onchange = () => { const u = new URL(location.href); u.searchParams.set('l', sel.value); location.replace(u.href); };
    document.querySelector('footer').appendChild(sel); };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const Q = new URLSearchParams(location.search), token = Q.get('g') || '', single = Q.get('f') || '', show = Q.get('show') === '1';
  const url = path => window.FOTOBOX_PHOTOS ? FOTOBOX_PHOTOS.url(path) : CFG.supabaseUrl + '/storage/v1/object/public/photos/' + String(path).split('/').map(encodeURIComponent).join('/');
  // Notfall-Kopie: antwortet der Foto-Speicher (Hetzner) nicht, das Bild bzw. Video von der Ersatzadresse laden
  // data-big: zuletzt dieses Bild nehmen (Fotoauswahl im Shop: das Original, solange seine Vorschau fehlt)
  document.addEventListener('error', e => { const el = e.target; if (!/^(IMG|VIDEO)$/.test(el?.tagName)) return;
    if (window.FOTOBOX_PHOTOS?.retry?.(el)) return; // erst erneut beim Foto-Speicher, dann Notfall-Kopie (config.js)
    const a = !el.dataset.alt && window.FOTOBOX_PHOTOS?.altSrc?.(el.currentSrc || el.src);
    if (a) { el.dataset.alt = '1'; el.src = a; } else if (el.dataset.big) { el.src = el.dataset.big; el.dataset.big = ''; } }, true);
  const fetchAny = async path => { // Herunterladen: erst Hetzner, sonst die Notfall-Kopie
    try { const r = await fetch(url(path)); if (r.ok) return r; } catch {}
    const a = window.FOTOBOX_PHOTOS?.alt?.(path); if (!a) throw new Error('nicht erreichbar'); const r = await fetch(a); if (!r.ok) throw new Error('nicht erreichbar'); return r;
  };

      el.onerror = () => done(false); setTimeout(() => done(false), 20000); el.src = t;
    });
    let blob = null; const getBlob = async src => blob || (blob = await fetch(src).then(r => { if (!r.ok) throw 0; return r.blob(); }));
    const fileName = () => [String(brand?.name || '').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, ''), what].filter(Boolean).join('-') + '.' + ext;
    const canShare = f => { try { return !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch { return false; } };
    const show = src => {
      const shareOk = canShare(new File([new Blob([''], { type })], fileName(), { type }));
      $('#title').textContent = vid ? 'Dein Video ist da!' : 'Dein Foto ist da!'; $('#sub').textContent = 'Speichern, teilen, Erinnerung behalten.';
      $('#main').innerHTML = `${orderNote()}<div class="polaroid">${vid ? `<video src="${esc(src)}" controls autoplay loop playsinline muted></video>` : `<img src="${esc(src)}" alt="Dein Foto">`}
          <div class="cap">${capHtml()}</div></div>
        <div class="acts"><button class="btn" id="oneDl">${I('download')} ${vid ? 'Video speichern' : 'Foto speichern'}</button>${shareOk ? `<button class="btn ghost" id="oneSh">${I('share')} Teilen</button>` : ''}</div>
        ${vid ? '' : `<button class="btn ghost sgo" id="oneShop" type="button" hidden>${I('gift')} <span></span></button>`}
        <p class="tip">${vid ? 'Tipp: Nach dem Speichern findest du das Video in deinen Downloads bzw. in der Fotos-App.' : 'Tipp: Auf dem iPhone das Foto gedrückt halten → „Zu Fotos hinzufügen“.'}</p>
        <p class="keep">${vid ? '<span>Dein Video bleibt 1 Jahr online und wird danach automatisch gelöscht.</span> <span>Speichere es dir am besten gleich.</span>'
          : '<span>Dein Foto bleibt 1 Jahr online und wird danach automatisch gelöscht.</span> <span>Speichere es dir am besten gleich.</span>'}</p>`;
      $('#oneDl').onclick = async () => { const b = $('#oneDl'); b.disabled = true;
        try { save(await getBlob(src), fileName()); } catch { window.open(src, '_blank'); }
        b.disabled = false; };
      if (shareOk) $('#oneSh').onclick = async () => {
        try { const f = new File([await getBlob(src)], fileName(), { type }); await navigator.share({ files: [f], ...(brand?.name ? { title: brand.name } : {}) }); }
        catch (e) { if (e?.name !== 'AbortError') window.open(src, '_blank'); }
      };
      if (!vid) showShop(src);
    };
    const wait = async n => {
      const src = await ready() || (alt ? await ready(alt) : null); if (src) return show(src); // sonst die Notfall-Kopie
      $('#main').innerHTML = `<div class="polaroid"><div class="ph"><div class="spin"></div><b>${vid ? 'Dein Video ist gleich da …' : 'Dein Foto ist gleich da …'}</b><small>${n < 60
        ? 'Es wird gerade von der Fotobox hochgeladen. Die Seite zeigt es von selbst an.'
        : 'Das dauert gerade etwas länger. Die Seite schaut weiter nach – du kannst diesen Link auch später noch einmal öffnen.'}</small></div>
        <div class="cap">${capHtml()}</div></div>`;
      setTimeout(() => wait(n + 1), n < 60 ? 3000 : 15000);
    };
    wait(0);
  }
  // Slideshow: zeigt die Fotos des Ereignisses nacheinander im Vollbild, neue Fotos kommen von selbst dazu
  function slideshow(password) {
    document.body.classList.add('show');
    $('#main').innerHTML = '<div id="ss"><img id="ssA" alt=""><img id="ssB" alt=""><div class="hint" id="ssHint"></div></div>';
    let i = 0, flip = false;
    const pics = () => photos.filter(p => p.kind !== 'video');
    const next = () => {
      const list = pics(); $('#ssHint').textContent = list.length ? '' : 'Noch keine Fotos – sobald Fotos gemacht wurden, erscheinen sie hier.';
      if (!list.length) return;
      const p = list[i % list.length], el = $(flip ? '#ssA' : '#ssB'), other = $(flip ? '#ssB' : '#ssA'), im = new Image(); i++;
      im.onload = () => { el.src = im.src; el.classList.add('on'); other.classList.remove('on'); flip = !flip; };
      im.src = url(p.path);
    };
    next(); setInterval(next, 6000);
    setInterval(async () => { try { const r = await fetchGallery(password); if (r.ok) { const had = photos.length; photos = r.photos || []; if (photos.length > had) i = 0; } } catch {} }, 30000); // neue Fotos zuerst
    $('#ss').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
  }

  let saved = ''; try { saved = sessionStorage.getItem('pm-gal-' + token) || ''; } catch {}
  if (single) showSingle(); else { langSel(); load(saved); }
})();
</script>
</body>
</html>
